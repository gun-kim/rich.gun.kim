# PR 에서 api 이미지가 빌드되는지만 확인한다. 레지스트리에는 올리지 않는다.
name: Check API image build

# 당분간 PR 자동 실행을 끈다. 되살리려면 아래 pull_request 블록의 주석을 푼다.
on:
  workflow_dispatch:
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - apps/api/**
  #     - packages/**
  #     - package.json
  #     - pnpm-lock.yaml
  #     - pnpm-workspace.yaml
  #     - tsconfig.base.json
  #     - .dockerignore
  #     - .github/workflows/api-image*.yml

concurrency:
  group: api-image-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-api-image:
    name: Build API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 서버(예: Oracle Cloud Ampere)에서도 받을 수 있도록 arm64 를 QEMU 로 함께 빌드한다.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
